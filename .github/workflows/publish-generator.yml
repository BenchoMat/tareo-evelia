name: Publish local list generator
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-generator.yml]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'publish local list generator v1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create generator and bundled workbook reader
        env:
          GENERATOR_B64: 
        run: |
          printf '%s' "$GENERATOR_B64" | base64 -d > generador.html
          curl -fsSL 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js' -o xlsx.mini.min.js
          test -s generador.html
          test -s xlsx.mini.min.js
          grep -q 'Crear enlace para Evelia' generador.html
          node --check xlsx.mini.min.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('generador.html').read_text()
          code=s[s.rindex('<script>')+8:s.rindex('</script>')]
          Path('/tmp/generator.js').write_text(code)
          PY
          node --check /tmp/generator.js
      - name: Commit published files
        run: |
          rm .github/workflows/publish-generator.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generador.html xlsx.mini.min.js .github/workflows/publish-generator.yml
          git commit -m 'feat: add local workbook list generator'
          git push origin HEAD:main