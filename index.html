<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF6EF"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Tareo · Lista de Evelia</title><style>
:root{--cream:#FAF6EF;--ink:#1F2328;--muted:#5A6066;--line:#E5E2DB;--soft:#D6F0ED;--teal:#2BB5A8;--deep:#F2EBDD;--warning:#F9ECD0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,input{font:inherit;color:inherit}button{cursor:pointer;min-height:52px;padding:13px 17px;border:1px solid var(--line);border-radius:14px;background:var(--deep);font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}textarea,input[type=file]{width:100%;padding:13px;border:1px solid #8C918B;border-radius:12px;background:#FFFCF7;font-size:16px}textarea{min-height:180px;resize:vertical}label{display:block;font-size:14px;font-weight:700;margin:16px 0}label textarea{margin-top:7px}h1,h2,h3,p{margin:0}h1{font-size:32px;line-height:1.15;letter-spacing:-1px;margin:8px 0 12px}h2{font-size:22px;line-height:1.3;margin:8px 0 14px}.small,small{font-size:13px;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.3px;font-weight:700;text-transform:uppercase}.shell{max-width:640px;margin:auto;padding:0 18px 72px}header{padding:18px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:800;letter-spacing:-.7px}.brand-mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;border-radius:11px;background:var(--teal);font-size:20px;vertical-align:middle}.intro{margin:20px 0 24px}.notice{background:var(--deep);border-radius:13px;padding:15px;font-size:13px;margin:16px 0}.notice.warning{background:var(--warning)}.stack{display:grid;gap:12px}.section{margin-top:25px}.choice{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:17px;padding:16px;background:#FFFCF7;min-height:82px;margin:0}.choice input{width:32px;height:32px;flex-shrink:0;accent-color:#1F8C82;margin:0}.choice strong{font-size:16px;display:block}.choice small{display:block;font-weight:400;margin-top:5px;white-space:pre-line}.choice.done{background:var(--soft)}.choice.done strong{text-decoration:line-through}progress{width:100%;height:13px;accent-color:#1F8C82}.sticky{position:sticky;bottom:12px;background:var(--cream);padding:13px;border:1px solid var(--line);border-radius:17px;margin-top:20px;z-index:2;box-shadow:0 6px 22px #1F23281A}.primary{background:var(--teal);border-color:var(--teal)}.outline{background:transparent}.wide{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.actions>*{flex:1;min-width:145px}.receipt{padding:11px 0;border-bottom:1px solid var(--line)}.finish{background:#FFE3DC;border-radius:18px;padding:18px;margin:18px 0}dialog{margin:auto 0 0;width:100%;max-width:none;max-height:92dvh;overflow:auto;border:1px solid var(--line);border-radius:24px 24px 0 0;background:var(--cream);color:var(--ink);padding:24px}dialog::backdrop{background:#1F232866}:focus-visible{outline:3px solid var(--ink);outline-offset:3px}[hidden]{display:none!important}@media(min-width:700px){dialog{width:480px;margin:auto;border-radius:24px}.shell{padding-top:10px}}
</style></head><body><div class="shell"><header><div class="brand"><span class="brand-mark" aria-hidden="true">T</span>Tareo</div><span class="small">Solo tu lista</span></header><main id="app"></main></div><dialog id="review" aria-labelledby="review-title"></dialog><script>
'use strict';const app=document.getElementById('app'),review=document.getElementById('review');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
function decodePayload(){try{const raw=location.hash.slice(1);if(!raw.startsWith('v1.'))throw Error();const encoded=raw.slice(3).replace(/-/g,'+').replace(/_/g,'/'),padded=encoded+'='.repeat((4-encoded.length%4)%4),bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0)),payload=JSON.parse(new TextDecoder().decode(bytes));if(!payload||payload.v!==1||!/^\d{4}-\d{2}-\d{2}$/.test(payload.date)||!Array.isArray(payload.items)||!payload.items.length||payload.items.length>100)throw Error();payload.items=payload.items.map((item,index)=>{if(!item||typeof item.name!=='string'||!item.name.trim()||item.name.length>200)throw Error();return{id:String(item.id||index+1).slice(0,100),name:item.name.trim(),notes:String(item.notes||'').slice(0,2000)}});return payload}catch{return null}}
const payload=decodePayload();if(!payload){app.innerHTML='<div class="intro"><p class="eyebrow">PREPARAR ENLACE</p><h1>Lleva la lista al celular.</h1><p>Rubén puede convertir aquí el HTML descargado del planeador en un enlace para Evelia.</p></div><div class="notice">El archivo se procesa solamente en este navegador. La lista no se sube ni se guarda en GitHub.</div><label>Lista descargada de Evelia<input id="source-file" type="file" accept=".html,text/html"></label><button class="primary wide" id="create-link" disabled>Crear enlace para Evelia</button><div id="link-result" hidden><label>Mensaje para WhatsApp<textarea id="link-text" readonly></textarea></label><div class="actions"><button class="primary" id="share-link">Enviar</button><button class="outline" id="copy-link">Copiar</button></div><p id="setup-help" class="small" aria-live="polite"></p></div>';let imported=null;const fileInput=document.getElementById('source-file'),createButton=document.getElementById('create-link'),result=document.getElementById('link-result'),linkText=document.getElementById('link-text'),help=document.getElementById('setup-help');function isoDate(value){const match=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);return match?match[3]+'-'+match[2]+'-'+match[1]:value}function extractList(html){const match=/\)\((\{"date":[\s\S]*\})\);/.exec(html);if(!match)throw Error('No encontramos una lista compatible. Descárgala nuevamente desde Tareo.');const source=JSON.parse(match[1]),candidate={v:1,date:isoDate(source.date),items:source.items};if(!/^\d{4}-\d{2}-\d{2}$/.test(candidate.date)||!Array.isArray(candidate.items)||!candidate.items.length)throw Error('La lista está vacía o dañada.');return candidate}function encodeList(value){const bytes=new TextEncoder().encode(JSON.stringify(value));let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return location.origin+location.pathname+'#v1.'+btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}fileInput.addEventListener('change',async()=>{imported=null;createButton.disabled=true;result.hidden=true;help.textContent='';const file=fileInput.files[0];if(!file)return;try{imported=extractList(await file.text());createButton.disabled=false;help.textContent=imported.items.length+' tareas listas para compartir.'}catch(error){help.textContent=error.message}});createButton.addEventListener('click',()=>{if(!imported)return;const link=encodeList(imported);linkText.value='Hola Evelia. Abre tu lista de Tareo aquí:\n'+link;result.hidden=false;linkText.focus();linkText.select()});async function copyLink(){try{await navigator.clipboard.writeText(linkText.value);help.textContent='Enlace copiado. Pégalo en WhatsApp para Evelia.'}catch{linkText.focus();linkText.select();help.textContent='El mensaje quedó seleccionado. Usa Copiar y pégalo en WhatsApp.'}}document.getElementById('copy-link').addEventListener('click',copyLink);document.getElementById('share-link').addEventListener('click',async()=>{const link=linkText.value.split('\n').pop();if(navigator.share){try{await navigator.share({title:'Lista de Tareo para Evelia',text:'Hola Evelia. Abre tu lista de Tareo aquí:',url:link});help.textContent='Enlace compartido.';return}catch(error){if(error&&error.name==='AbortError')return}}await copyLink()})}else{function listKey(text){let hash=2166136261;for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619)}return(hash>>>0).toString(36)}const storageKey='tareo-evelia:'+listKey(location.hash);let checked=new Set(),closed=false;try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');checked=new Set((saved.checked||[]).filter(id=>payload.items.some(t=>t.id===id)));closed=Boolean(saved.closed)}catch{}function save(){try{localStorage.setItem(storageKey,JSON.stringify({checked:[...checked],closed,updatedAt:new Date().toISOString()}))}catch{}}function report(){return'Visita '+fmt(payload.date)+' — Evelia\n'+(closed?'Cierre confirmado':'Avance provisional')+'\n\nCompletadas:\n'+(payload.items.map((t,i)=>checked.has(t.id)?(i+1)+'. '+t.name:null).filter(Boolean).join('\n')||'Ninguna')+'\n\nPendientes:\n'+(payload.items.map((t,i)=>!checked.has(t.id)?(i+1)+'. '+t.name:null).filter(Boolean).join('\n')||'Ninguna')+'\n\nEste reporte no actualiza el Excel. Envíalo a Rubén.'}function draw(){app.innerHTML='<div class="intro"><p class="eyebrow">TU LISTA · '+esc(fmt(payload.date))+'</p><h1>Hola, Evelia.</h1><p>Una tarea a la vez. Marca lo que vayas terminando.</p></div><div class="notice">Tu avance queda guardado en este teléfono. Aun así, envía el reporte a Rubén cuando termines.</div>'+(closed?'<div class="finish"><h2>Cierre confirmado</h2><p>'+checked.size+' completadas · '+(payload.items.length-checked.size)+' pendientes</p></div>':'<p><b>'+checked.size+' de '+payload.items.length+' completadas</b></p><progress aria-label="Progreso de la visita" value="'+checked.size+'" max="'+payload.items.length+'"></progress>')+'<div class="stack section">'+payload.items.map((t,i)=>'<label class="choice '+(checked.has(t.id)?'done':'')+'"><input type="checkbox" data-id="'+esc(t.id)+'" '+(checked.has(t.id)?'checked ':'')+(closed?'disabled':'')+'><span><strong>'+(i+1)+'. '+esc(t.name)+'</strong>'+(t.notes?'<small>'+esc(t.notes)+'</small>':'')+'</span></label>').join('')+'</div>'+(closed?'':'<div class="sticky"><button class="primary wide" id="review-button">Revisar pendientes</button></div>')+'<label>Reporte para Rubén<textarea id="report-text" readonly>'+esc(report())+'</textarea></label><div class="actions"><button class="primary" id="share">Enviar reporte</button><button class="outline" id="copy">Copiar</button><button class="outline" id="download">Descargar</button></div><p id="help" class="small" aria-live="polite">Enviar abre el menú del teléfono para elegir WhatsApp.</p>'+(closed?'<button class="outline wide section" id="reset">Empezar esta prueba de nuevo</button>':'')}function openReview(){review.innerHTML='<h2 id="review-title">Antes de cerrar</h2><p>'+checked.size+' completadas · '+(payload.items.length-checked.size)+' pendientes.</p><div class="notice warning">Solo cuentan como hechas las que marcaste.</div><h3>Quedaron pendientes</h3>'+(payload.items.filter(t=>!checked.has(t.id)).map(t=>'<p class="receipt">'+esc(t.name)+'</p>').join('')||'<p class="receipt">Ninguna</p>')+'<div class="actions"><button id="back">Volver</button><button id="confirm" class="primary">Confirmar cierre</button></div>';review.showModal()}async function copyReport(){const text=report(),help=document.getElementById('help');try{await navigator.clipboard.writeText(text);help.textContent='Reporte copiado. Pégalo en WhatsApp para Rubén.';return true}catch{}const area=document.getElementById('report-text');area.focus();area.select();try{if(document.execCommand('copy')){help.textContent='Reporte copiado. Pégalo en WhatsApp para Rubén.';return true}}catch{}help.textContent='El texto quedó seleccionado. Mantén presionado y elige Copiar.';return false}async function shareReport(){const text=report(),help=document.getElementById('help');if(navigator.share){try{await navigator.share({title:'Reporte de Tareo',text});help.textContent='Reporte compartido.';return}catch(error){if(error&&error.name==='AbortError')return}}await copyReport()}function downloadReport(){const url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='reporte-evelia-'+payload.date+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}app.addEventListener('change',event=>{const id=event.target.dataset.id;if(!id||closed)return;event.target.checked?checked.add(id):checked.delete(id);save();draw();const updated=[...app.querySelectorAll('[data-id]')].find(input=>input.dataset.id===id);updated?.focus({preventScroll:true})});app.addEventListener('click',event=>{if(event.target.id==='review-button')openReview();if(event.target.id==='share')shareReport();if(event.target.id==='copy')copyReport();if(event.target.id==='download')downloadReport();if(event.target.id==='reset'&&confirm('¿Borrar los checks y empezar de nuevo?')){checked.clear();closed=false;save();draw();scrollTo(0,0)}});review.addEventListener('click',event=>{if(event.target.id==='back')review.close();if(event.target.id==='confirm'){closed=true;save();review.close();draw();document.getElementById('report-text').focus()}});review.addEventListener('cancel',event=>{event.preventDefault();review.close()});draw()}
</script></body></html>
